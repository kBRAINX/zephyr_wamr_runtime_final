# boards/nucleo_wb55rg.conf — reglages specifiques a la carte NUCLEO-WB55RG
#
# Applique AUTOMATIQUEMENT par Zephyr lorsqu'on compile pour nucleo_wb55rg,
# grace a son nom (mecanisme de configuration par carte). Ne definit QUE
# l'identite du noeud ; le transport (BLE) est choisi via conf/ble.conf.
#
# PREREQUIS MATERIEL IMPERATIF (voir docs/NUCLEO_WB55RG.md) :
# le coprocesseur radio M0+ doit avoir ete flashe au prealable avec le
# firmware "HCI Only" (STM32CubeProgrammer). Sans cela, bt_enable() echoue
# avec un kernel oops (HCI timeout) au demarrage. Ce n'est PAS un reglage
# logiciel : c'est une operation de flash prealable, une fois par carte.

CONFIG_WAMR_NODE_DEVICE_NAME="nucleo-wb55rg"
CONFIG_WAMR_NODE_DEVICE_TYPE="stm32wb55"
CONFIG_WAMR_NODE_OS_NAME="zephyr"

# Nom d'annonce BLE coherent avec l'identite.
CONFIG_BT_DEVICE_NAME="nucleo-wb55rg"

# --- Empreinte memoire WAMR reduite ---
# Le STM32WB55RG n'a que ~192 Ko de RAM applicative, dont une partie est
# consommee par la pile Bluetooth. Le pool WAMR par defaut (160 Ko) + les
# buffers ne rentrent pas (debordement RAM de ~114 Ko). On reduit donc au
# strict necessaire :
#  - pool 72 Ko : contient la memoire lineaire WASM (64 Ko incompressibles)
#    + les metadonnees WAMR (~8 Ko). C'est le plancher realiste ;
#  - binaire .wasm plafonne a 10 Ko (le module fait ~7 Ko) ;
#  - pile et tas d'execution reduits.
# Economie totale ~118 Ko : couvre le debordement de 114 Ko avec marge.
CONFIG_WAMR_APP_POOL_SIZE_KB=72
CONFIG_WAMR_APP_WASM_MAX_KB=10
CONFIG_WAMR_APP_STACK_KB=4
CONFIG_WAMR_APP_HEAP_KB=8

# Tas Zephyr (distinct du pool WAMR) : la valeur de prj.conf (64 Ko) est
# surdimensionnee pour le NUCLEO. On la reduit a 16 Ko pour degager de la
# marge RAM supplementaire. Le module de metriques n'alloue pas dynamiquement
# cote Zephyr, 16 Ko suffisent largement.
CONFIG_HEAP_MEM_POOL_SIZE=16384