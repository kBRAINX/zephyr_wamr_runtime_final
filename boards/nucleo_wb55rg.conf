# boards/nucleo_wb55rg.conf — reglages specifiques a la carte NUCLEO-WB55RG
#
# Applique AUTOMATIQUEMENT par Zephyr lorsqu'on compile pour nucleo_wb55rg,
# grace a son nom (mecanisme de configuration par carte). Ne definit QUE
# l'identite du noeud ; le transport (BLE) est choisi via conf/ble.conf.
#
# PREREQUIS MATERIEL IMPERATIF (voir docs/NUCLEO_WB55RG.md) :
# le coprocesseur radio M0+ doit avoir ete flashe au prealable avec le
# firmware "HCI Only" (STM32CubeProgrammer). Sans cela, bt_enable() echoue
# avec un kernel oops (HCI timeout) au demarrage. Ce n'est PAS un reglage
# logiciel : c'est une operation de flash prealable, une fois par carte.

CONFIG_WAMR_NODE_DEVICE_NAME="nucleo-wb55rg"
CONFIG_WAMR_NODE_DEVICE_TYPE="stm32wb55"
CONFIG_WAMR_NODE_OS_NAME="zephyr"

# Nom d'annonce BLE coherent avec l'identite.
CONFIG_BT_DEVICE_NAME="nucleo-wb55rg"
