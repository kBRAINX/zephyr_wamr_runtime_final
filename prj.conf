# prj.conf — configuration de BASE, NEUTRE vis-a-vis du transport
#
# ============================================================================
# POINT CENTRAL DE CETTE MISE A JOUR
# ============================================================================
# Ce fichier n'active NI le Wi-Fi, NI le Bluetooth. Le Wi-Fi n'est donc PAS
# une dependance stricte : le firmware compile sur n'importe quelle carte, y
# compris une carte sans Wi-Fi (comme le NUCLEO-WB55RG).
#
# Le transport est choisi en AJOUTANT un fichier de configuration au moment
# du build, via -DEXTRA_CONF_FILE :
#
#   Wi-Fi :  west build -b <carte_wifi> . -- -DEXTRA_CONF_FILE=conf/wifi.conf
#   BLE   :  west build -b <carte_ble>  . -- -DEXTRA_CONF_FILE=conf/ble.conf
#
# ============================================================================

# --- WAMR : gros pool global, indispensable sur cible contrainte ---
# (equivalent Kconfig du reglage WAMR_BUILD_SHRUNK_MEMORY / global heap)

# --- Console / logs : printk seul, sans le sous-systeme de log ---
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_LOG=n

# --- Memoire ---
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_COMMON_LIBC_MALLOC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=8192

# --- Metriques M1/M7/M8 : statistiques d'ordonnancement ---
# Generique a toute architecture supportee par Zephyr.
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_THREAD_RUNTIME_STATS_USE_TIMING_FUNCTIONS=y
CONFIG_TIMING_FUNCTIONS=y

# --- Metrique M11 : nombre de threads actifs (detection de fuite) ---
CONFIG_THREAD_MONITOR=y

# --- Metrique M7 : occupation reelle de la pile ---
# INIT_STACKS pre-remplit les piles d'un motif temoin : c'est ce qui permet a
# k_thread_stack_space_get() de mesurer l'espace reellement inutilise.
# THREAD_STACK_INFO expose la taille/base de pile (k_thread_stack_size_get()).
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y

# --- Optimisation pour la TAILLE ---
CONFIG_SIZE_OPTIMIZATIONS=y

# --- Retirer ce qui ne sert pas en production ---
CONFIG_LOG=n
CONFIG_ASSERT=n
CONFIG_BOOT_BANNER=n
CONFIG_PRINTK=y          # garder printk (host_print), c'est peu coûteux
CONFIG_THREAD_NAME=n

# --- Newlib nano (si la libc est utilisée) : plus compacte ---
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=y

# --- Identite du noeud (surchargeable par carte via un .conf dedie) ---
# Ces chaines sont exposees au module WASM a l'execution (jamais codees en
# dur dans le .wasm).
CONFIG_WAMR_NODE_DEVICE_NAME="zephyr_node"
CONFIG_WAMR_NODE_DEVICE_TYPE="generic"
CONFIG_WAMR_NODE_OS_NAME="zephyr"