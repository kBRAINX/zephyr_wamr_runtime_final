# conf/wifi.conf — overlay de transport Wi-Fi
#
# A ajouter au build pour selectionner le transport Wi-Fi :
#   west build -b <carte_wifi> . -- -DEXTRA_CONF_FILE=conf/wifi.conf
#
# Active le Wi-Fi + la pile TCP/IPv4. Le fichier transport_wifi.c est alors
# compile (il est garde par #if defined(CONFIG_WIFI)).

CONFIG_WIFI=y
CONFIG_WIFI_NM=y

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_ETHERNET_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=5
CONFIG_NET_MGMT_EVENT_INFO=y

CONFIG_NET_BUF_RX_COUNT=8
CONFIG_NET_BUF_TX_COUNT=8
CONFIG_NET_PKT_RX_COUNT=4
CONFIG_NET_PKT_TX_COUNT=4
CONFIG_NET_BUF_DATA_SIZE=128

# Identifiants du point d'acces (surchargeables au build).
CONFIG_WAMR_WIFI_SSID="a26nguep-hotspot"
CONFIG_WAMR_WIFI_PSK="123456789"
