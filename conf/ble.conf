# conf/ble.conf — overlay de transport Bluetooth LE
#
# A ajouter au build pour selectionner le transport BLE :
#   west build -b <carte_ble> . -- -DEXTRA_CONF_FILE=conf/ble.conf
#
# Active la pile Bluetooth LE en role peripherique + le service NUS natif de
# Zephyr. Le fichier transport_ble.c est alors compile (garde par
# #if defined(CONFIG_BT) && !defined(CONFIG_WIFI)).

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y

# Service NUS natif Zephyr (PAS le SDK nRF).
CONFIG_BT_ZEPHYR_NUS=y

# Nom d'annonce BLE = identite exposee au WASM.
CONFIG_BT_DEVICE_NAME="wamr-ble-node"
CONFIG_BT_DEVICE_NAME_DYNAMIC=n

# GATT / debit : MTU confortable pour transmettre le JSON en peu de trames.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_ATT_PREPARE_COUNT=2

# Un seul central (la passerelle) a la fois.
CONFIG_BT_MAX_CONN=1

# Identite exposee au module WASM (host_get_*). Le transport, lui, est
# fourni dynamiquement par transport_name() -> "ble".
CONFIG_WAMR_NODE_DEVICE_NAME="wamr-ble-node"
CONFIG_WAMR_NODE_DEVICE_TYPE="ble_peripheral"
CONFIG_WAMR_NODE_OS_NAME="zephyr"
